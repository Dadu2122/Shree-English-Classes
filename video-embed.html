<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id') || '';
  if (id) {
    document.body.innerHTML =
      '<iframe src="https://www.youtube.com/embed/' + id + '?autoplay=1&playsinline=1&rel=0" ' +
      'allow="autoplay; encrypted-media" allowfullscreen></iframe>';
  } else {
    document.body.innerHTML = '<p style="color:#fff;font-family:sans-serif;text-align:center;padding-top:40%;">No video ID provided.</p>';
  }
</script>
</body>
</html>
